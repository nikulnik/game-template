name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `node --test` runs the TypeScript directly, which needs 22.18 or newer.
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # All five, because four of them are the ones nobody runs by accident.
      - run: npm run build:all
