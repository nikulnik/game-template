<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No zooming, no bounce, and a viewport that reaches under a phone's notch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- TEMPLATE: the title is what a browser tab and a bookmark show. -->
    <title>Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* TEMPLATE: the same colour as the app background in main.ts and electron/main.cjs, so
           nothing flashes white between the page loading and the first frame. */
        background: #1a1a2e;
        /* The game is the whole page: nothing here scrolls, bounces or pulls down to refresh. */
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Fixed to the viewport rather than the document, so a phone's address bar sliding in or out
         resizes the canvas instead of pushing it off the screen. */
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      /* The HUD, for the three.js half of the template: three.js has no text worth the name, and a
         browser lays out, wraps, translates and reads out a line of it for nothing. Unused by the
         Pixi half, which draws its HUD in the scene — an empty layer that catches nothing costs
         nothing, but it is yours to delete. `--hud` is set from `fitHud`, and everything inside is
         sized in `em`, so the whole overlay scales with one number. */
      #hud {
        position: fixed;
        inset: 0;
        /* The game is underneath: taps go through. A button in here needs `pointer-events: auto`. */
        pointer-events: none;
        /* Clear of a notch, a rounded corner and a home indicator, on the phones that have them. */
        padding: calc(0.7em + env(safe-area-inset-top)) calc(0.7em + env(safe-area-inset-right))
          calc(0.7em + env(safe-area-inset-bottom)) calc(0.7em + env(safe-area-inset-left));
        font: 500 calc(1.5rem * var(--hud, 1)) / 1.25 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #fff;
        text-shadow: 0 1px 3px rgb(0 0 0 / 0.6);
      }
      /* TEMPLATE: anything in the HUD that is laid out as a flex or grid box is also something the
         game hides and shows, and a class with an id in front of it outranks the browser's own
         `[hidden] { display: none }` — so without this, setting `hidden` on it does nothing at all
         and the code looks right. Leave it here. */
      #hud [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <!-- The renderer is picked in vite.config.ts, which points this at src/main3d.ts for a three.js
         project. Leave the path alone; see TEMPLATE.md § Pick a renderer. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
